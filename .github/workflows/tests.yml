name: Tests

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Secrets placeholder
        run: cp Secrets.xcconfig.example Secrets.xcconfig
      - name: Pick an iPhone simulator
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Unit tests (ad-hoc signed, no team)
        run: |
          xcodebuild test -project KalorienKompass.xcodeproj -scheme KalorienKompass \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -only-testing:KalorienKompassTests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

  cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLI tests
        working-directory: KalorienKompassCLI
        run: swift test
